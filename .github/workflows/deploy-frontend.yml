name: Deploy frontend to Azure

# Branch → environment mapping (mirrors deploy-backend.yml):
#   develop → dev  (grounded-rag-dev  Static Web App) — deploys automatically
#   main    → prod (grounded-rag-prod Static Web App) — MANUAL ONLY
#
# Replaces the previous GitHub Pages deploy. Pages could only ever host ONE
# build, so there was no way to look at in-progress work without publishing it
# to the live site. Two Static Web Apps give a dev URL to review on and a prod
# URL that only moves when promoted deliberately.
#
# Static Web Apps Free tier: $0, 100 GB bandwidth/month, 250 MB per app (this
# export is ~1 MB), free TLS on the Azure-issued *.azurestaticapps.net
# hostname. Chosen over Container Apps because the API's scale-to-zero costs
# come out of the shared Container Apps free grant, and the frontend is static
# anyway — it needs a CDN, not a container.
#
# One-time setup: see docs/deployment.md.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy'
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.pick.outputs.env_name }}
      api_base_url: ${{ steps.pick.outputs.api_base_url }}
      site_url: ${{ steps.pick.outputs.site_url }}
      token_secret_name: ${{ steps.pick.outputs.token_secret_name }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          else
            TARGET="dev"
          fi

          if [ "$TARGET" = "prod" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "api_base_url=${{ vars.PROD_API_BASE_URL }}" >> $GITHUB_OUTPUT
            echo "site_url=${{ vars.PROD_SITE_URL }}" >> $GITHUB_OUTPUT
            echo "token_secret_name=AZURE_SWA_TOKEN_PROD" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "api_base_url=${{ vars.DEV_API_BASE_URL }}" >> $GITHUB_OUTPUT
            echo "site_url=${{ vars.DEV_SITE_URL }}" >> $GITHUB_OUTPUT
            echo "token_secret_name=AZURE_SWA_TOKEN_DEV" >> $GITHUB_OUTPUT
          fi
          echo "Deploying frontend to $TARGET"

  build-and-deploy:
    name: Deploy to ${{ needs.resolve.outputs.env_name }}
    runs-on: ubuntu-latest
    needs: resolve
    environment:
      name: ${{ needs.resolve.outputs.env_name }}
      url: ${{ needs.resolve.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.resolve.outputs.api_base_url }}
          NEXT_PUBLIC_SITE_URL: ${{ needs.resolve.outputs.site_url }}
          # Empty, unlike the old Pages build: Static Web Apps serves from the
          # domain root, while Pages served from /private-rag-core. A stale
          # BASE_PATH here breaks every asset URL on the deployed site.
          BASE_PATH: ''
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[needs.resolve.outputs.token_secret_name] }}
          action: upload
          app_location: frontend/out
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test the deployment
        # A green upload step doesn't prove the site actually serves.
        run: |
          URL="${{ needs.resolve.outputs.site_url }}"
          if [ -z "$URL" ]; then
            echo "::warning::site_url not configured; skipping smoke test"
            exit 0
          fi
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then echo "Serving OK after ${i} attempt(s)"; exit 0; fi
            echo "  attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::Frontend never returned 200 at $URL"
          exit 1
