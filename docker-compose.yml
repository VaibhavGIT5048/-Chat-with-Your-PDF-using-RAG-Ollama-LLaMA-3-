services:
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rag-net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      # Pulled from the project-root .env via Compose's built-in interpolation —
      # only this one secret crosses over, so local-dev values in .env (e.g. a
      # localhost QDRANT_URL) never leak in and shadow .env.docker's container values.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your .env file}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data/chunks:/home/appuser/app/data/chunks
      - ./data/indexes:/home/appuser/app/data/indexes
      - ./data/evals:/home/appuser/app/data/evals
      - ./data/flashrank_cache:/home/appuser/app/data/flashrank_cache
    networks:
      - rag-net

  frontend:
    image: private-rag-core-frontend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BASE_PATH: ""
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vaibhavgit5048.github.io/private-rag-core/}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  qdrant_storage:
